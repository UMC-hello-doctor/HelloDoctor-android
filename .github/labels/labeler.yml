# .github/labeler.yml
"📱 ui/presentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/ui/**"
      - "**/presentation/**"
      - "**/res/**/*.xml"
      - "**/layout/**"

"🧠 domain/usecase":
  - changed-files:
    - any-glob-to-any-file:
      - "app/src/main/java/**/*UseCase*"
      - "app/src/main/java/**/*Repository*"
      - "app/src/main/java/**/domain/**/*"

"🗂 data/repository":
  - changed-files:
    - any-glob-to-any-file:
      - "app/src/main/java/**/data/**/*"
      - "app/src/main/java/**/*Dto*"

"🌐 network/api":
  - changed-files:
    - any-glob-to-any-file:
      - "app/src/main/java/**/network/**/*"
      - "app/src/main/java/**/api/**/*"

"💾 local/db":
  - changed-files:
    - any-glob-to-any-file:
      - "app/src/main/java/**/local/**/*"
      - "app/src/main/java/**/*Dao*"

"🧪 test":
  - changed-files:
    - any-glob-to-any-file:
      - "app/src/test/**/*"
      - "app/src/androidTest/**/*"

"⚙️ build/gradle":
  - changed-files:
    - any-glob-to-any-file:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"