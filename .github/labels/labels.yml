# .github/labels.yml
labels:
  # 기본 타입
  - name: "🐞 bug"
    color: "e11d21"
    description: "버그/크래시/오동작"
  - name: "✨ feature"
    color: "a2eeef"
    description: "새 기능 추가/개선"
  - name: "🔧 refactor"
    color: "d4c5f9"
    description: "코드 리팩토링"
  - name: "📖 docs"
    color: "0075ca"
    description: "문서/주석"

  # 우선순위
  - name: "🚨 P0"
    color: "cc0000"
    description: "크리티컬"
  - name: "🔥 P1"
    color: "ff6600"
    description: "높음"
  - name: "⚠️ P2"
    color: "ffaa00"
    description: "보통"
  - name: "🔽 P3"
    color: "ffcc00"
    description: "낮음"

  # 안드로이드 영역
  - name: "📱 ui/presentation"
    color: "663399"
    description: "Activity/Fragment/Layout"
  - name: "🧠 domain/usecase"
    color: "5319e7"
    description: "도메인/비즈니스 로직"
  - name: "🗂 data/repository"
    color: "1d76db"
    description: "Repository/DTO"
  - name: "🌐 network/api"
    color: "0e8a16"
    description: "API/네트워크"
  - name: "💾 local/db"
    color: "fbca04"
    description: "Room/로컬 저장소"
  - name: "🧪 test"
    color: "bfe5bf"
    description: "테스트 코드"
  - name: "⚙️ build/gradle"
    color: "bfdadc"
    description: "빌드/Gradle 설정"

  # 상태
  - name: "📌 status: todo"
    color: "eeeeee"
    description: "할 일"
  - name: "🏃 status: in progress"
    color: "006b75"
    description: "진행중"
  - name: "🔍 status: code review"
    color: "0066cc"
    description: "코드리뷰"
  - name: "🚧 status: blocked"
    color: "663399"
    description: "막힘"
  - name: "✅ status: done"
    color: "0e8a16"
    description: "완료"
