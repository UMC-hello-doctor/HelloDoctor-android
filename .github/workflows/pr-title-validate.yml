name: PR Title Validator

on:
  pull_request:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Validate PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            // Conventional Commits pattern: <type>(<scope>): <subject>
            const pattern = /^(feat|fix|chore|docs|refactor|test|perf|ci)(\([a-z\-]+\))?: .{1,50}$/;
            const scopePattern = /^\(([a-z\-]+)\)$/;

            const isValid = pattern.test(title);

            if (!isValid) {
              let message = '❌ PR 제목이 Conventional Commits 형식을 따르지 않습니다.\n\n';
              message += '**필수 형식:**\n';
              message += '```\n<type>(<scope>): <subject>\n```\n\n';
              message += '**예시:**\n';
              message += '```\n';
              message += 'feat(drug): 약물 검색 기능 구현\n';
              message += 'fix(auth): 토큰 만료 오류 수정\n';
              message += 'chore: 의존성 업데이트\n';
              message += '```\n\n';
              message += '**Type 가능한 값:**\n';
              message += '- `feat` - 새 기능\n';
              message += '- `fix` - 버그 수정\n';
              message += '- `chore` - 유지보수, 설정, 의존성 업데이트\n';
              message += '- `docs` - 문서 변경\n';
              message += '- `refactor` - 코드 리팩토링\n';
              message += '- `test` - 테스트 변경\n';
              message += '- `perf` - 성능 개선\n';
              message += '- `ci` - CI/CD 설정\n\n';
              message += '**Scope 가능한 값 (선택사항):**\n';
              message += '- `auth` - 인증 기능\n';
              message += '- `drug` - 의약품 검색\n';
              message += '- `chat` - AI 상담\n';
              message += '- `navermap` - 지도 기능\n';
              message += '- `userinfo` - 사용자 정보\n';
              message += '- `network` - 네트워크/API\n';
              message += '- `ui` - UI 컴포넌트\n';
              message += '- `permission` - 권한 처리\n\n';
              message += '**Subject 규칙:**\n';
              message += '- 최대 50자\n';
              message += '- 명령형 태도 (동사 원형 사용)\n';
              message += '- 마침표 없음\n\n';
              message += `**현재 제목:** \`${title}\``;

              core.setFailed(message);

              // Comment on PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message
              });
            } else {
              console.log('✅ PR 제목이 올바른 형식입니다.');
            }
