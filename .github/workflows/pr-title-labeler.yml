name: PR Title Labeler

on:
  pull_request:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-by-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write

    steps:
      - name: Add label based on PR title (Conventional Commits)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            const labels = [];

            // Extract type from conventional commits format: <type>(<scope>): <subject>
            const typeMatch = title.match(/^(feat|fix|chore|docs|refactor|test|perf|ci)/);
            const scopeMatch = title.match(/\(([a-z\-]+)\)/);

            if (typeMatch) {
              const type = typeMatch[1];

              // Map type to label
              switch(type) {
                case 'feat':
                  labels.push('✨ feature');
                  break;
                case 'fix':
                  labels.push('🐞 bug');
                  break;
                case 'refactor':
                  labels.push('🔧 refactor');
                  break;
                case 'chore':
                  labels.push('🧹 chore');
                  break;
                case 'docs':
                  labels.push('📚 docs');
                  break;
                case 'test':
                  labels.push('✅ test');
                  break;
                case 'perf':
                  labels.push('⚡ performance');
                  break;
                case 'ci':
                  labels.push('🤖 ci');
                  break;
              }
            }

            // Add scope label if present
            if (scopeMatch) {
              const scope = scopeMatch[1];
              labels.push(`scope: ${scope}`);
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });
              console.log(`✅ Applied labels: ${labels.join(', ')}`);
            }
