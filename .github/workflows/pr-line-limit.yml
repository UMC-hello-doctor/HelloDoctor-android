name: PR Line Limit Check
on:
  pull_request:
    types: [opened, synchronize, labeled]  # 생성/업데이트/라벨 변경 시

jobs:
  check-lines:
    # design 라벨 있으면 스킵
    if: "!contains(github.event.pull_request.labels.*.name, 'design')"
    runs-on: ubuntu-latest
    steps:
    # 1. 베이스 브랜치 체크아웃
    - name: Checkout base
      uses: actions/checkout@v4
      with:
        ref: ${{ github.base_ref }}

    # 2. 베이스 커밋 해시 저장
    - name: Get base commit
      run: echo "BASE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

    # 3. PR 브랜치 체크아웃
    - name: Checkout PR branch
      uses: actions/checkout@v4

    # 4. 추가 줄 수 계산 (180 경고 / 200 실패)
    - name: Count added lines
      id: count
      env:
        LIMIT: 200        # 실패 임계값
        WARNING_LIMIT: 180  # 경고 임계값
        IGNORE: '**/test/**|**/androidTest/**|*.md|*.xml|*.json|*.iml|*.idea/**|**/build/**'
      run: |
        # 추가 줄만 카운트 (Kotlin/Java/XML/Gradle 대상)
        CHANGED=$(git diff $BASE_COMMIT --numstat \
          | grep -vE "$IGNORE" \
          | grep -E '\.(kt|java|xml|gradle|kts|ktm|ktsm)$' \
          | awk '{add+=$1} END {print add+0}')
        
        echo "added_lines=$CHANGED" >> $GITHUB_OUTPUT
        
        if [ "$CHANGED" -gt "$LIMIT" ]; then
          echo "::error::🚫 PR 변경 추가 줄 수가 $LIMIT 초과 ($CHANGED 줄) - 실패!"
          exit 1
        elif [ "$CHANGED" -ge "$WARNING_LIMIT" ]; then
          echo "::warning::⚠️ PR 변경 줄 수 주의 ($CHANGED 줄 / $LIMIT) - 리뷰어 추가 확인 필요"
        else
          echo "::notice::✅ PR 변경 줄 수 OK ($CHANGED 줄 / $LIMIT)"
        fi

    # 5. 실패/경고 시 PR 주석 추가
    - name: Comment on PR for warning/error
      if: always()
      uses: actions/github-script@v7
      env:
        ADDED_LINES: ${{ steps.count.outputs.added_lines }}
      with:
        script: |
          const lines = parseInt(process.env.ADDED_LINES || '0');
          const limit = 200;
          const warnLimit = 190;
          let message = '';
          
          if (lines > limit) {
            message = `🚫 **PR 크기 제한 위반** 🚫\n\n` +
                      `추가 변경 줄 수: **${lines}** 줄 (제한: ${limit}줄)\n` +
                      `작은 단위로 나누어 PR을 생성해 주세요!`;
          } else if (lines >= warnLimit) {
            message = `⚠️ **PR 크기 주의** ⚠️\n\n` +
                      `추가 변경 줄 수: **${lines}** 줄 (권장: ${warnLimit}줄 미만)\n` +
                      `추가 리뷰어 지정 권장합니다!`;
          }
          
          if (message) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
          }

    # 6. design 라벨 스킵 시 알림
    - name: Notify design label skip
      if: contains(github.event.pull_request.labels.*.name, 'design')
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **design 라벨 확인됨** - 줄 수 제한 체크 스킵됨\n\n디자인/UI 변경은 예외 처리됩니다.'
          });