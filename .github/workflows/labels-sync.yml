# .github/workflows/labels-sync.yml
name: Sync Labels
on:
  push:
    branches: [develop]
    paths: ['.github/labels/labels.yml']
  workflow_dispatch:

concurrency:
  group: labels-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels/labels.yml
          skip-delete: true