name: Commit Message Lint

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Get commits from PR
            const commits = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            // Conventional Commits pattern: <type>(<scope>): <subject>
            const typePattern = /^(feat|fix|chore|docs|refactor|test|perf|ci)/;
            const fullPattern = /^(feat|fix|chore|docs|refactor|test|perf|ci)(\([a-z\-]+\))?: .+/;

            let hasErrors = false;
            let errorMessages = [];

            for (const commit of commits.data) {
              const message = commit.commit.message;
              const firstLine = message.split('\n')[0];

              if (!fullPattern.test(firstLine)) {
                hasErrors = true;
                errorMessages.push({
                  sha: commit.sha.substring(0, 7),
                  message: firstLine,
                  reason: '형식이 잘못되었습니다'
                });
              }

              // Check subject length (max 50 chars)
              const subjectMatch = firstLine.match(/^[^:]+: (.+)$/);
              if (subjectMatch) {
                const subject = subjectMatch[1];
                if (subject.length > 50) {
                  hasErrors = true;
                  errorMessages.push({
                    sha: commit.sha.substring(0, 7),
                    message: firstLine,
                    reason: `Subject이 너무 깁니다 (${subject.length}/50자)`
                  });
                }
              }
            }

            if (hasErrors) {
              let comment = '❌ 일부 커밋 메시지가 규칙을 따르지 않습니다.\n\n';
              comment += '**문제가 있는 커밋:**\n';

              errorMessages.forEach(error => {
                comment += `\n- **${error.sha}**: ${error.reason}\n`;
                comment += `  \`${error.message}\`\n`;
              });

              comment += '\n---\n\n';
              comment += '**필수 형식:**\n';
              comment += '```\n<type>(<scope>): <subject>\n```\n\n';
              comment += '**예시:**\n';
              comment += '```\n';
              comment += 'feat(drug): 약물 검색 기능 구현\n';
              comment += 'fix(auth): 토큰 만료 오류 수정\n';
              comment += 'chore: 의존성 업데이트\n';
              comment += '```\n\n';
              comment += '**Type 가능한 값:**\n';
              comment += '- `feat` - 새 기능\n';
              comment += '- `fix` - 버그 수정\n';
              comment += '- `chore` - 유지보수, 설정, 의존성 업데이트\n';
              comment += '- `docs` - 문서 변경\n';
              comment += '- `refactor` - 코드 리팩토링\n';
              comment += '- `test` - 테스트 변경\n';
              comment += '- `perf` - 성능 개선\n';
              comment += '- `ci` - CI/CD 설정\n\n';
              comment += '**Scope (선택사항):**\n';
              comment += '- `auth`, `drug`, `chat`, `navermap`, `userinfo`, `network`, `ui`, `permission`\n\n';
              comment += '**Subject 규칙:**\n';
              comment += '- 최대 50자\n';
              comment += '- 명령형 태도 (동사 원형 사용)\n';
              comment += '- 마침표 없음\n\n';
              comment += '**자세한 규칙:** [commit-conventions.md](./.claude/rules/commit-conventions.md)';

              // Create comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: comment
              });

              core.setFailed('커밋 메시지 검증 실패');
            } else {
              console.log('✅ 모든 커밋 메시지가 규칙을 따릅니다.');
            }
